set -g mouse on
set -g history-limit 100000
set -g default-terminal "tmux-256color"
set -g extended-keys on
set -s escape-time 0
# Recommended for Claude Code: pass terminal notifications/hyperlinks through, full key support
set -g allow-passthrough on
set -as terminal-features 'xterm*:extkeys'
# Status bar: the shortcuts, so nobody has to remember them (the short form on narrow windows)
set -g status-left-length 20
set -g status-right-length 100
set -g status-right '#{?#{e|<:#{window_width},130},Ctrl-b d: leave (keeps running) · Ctrl-b ?: keys ,Ctrl-b then:  d leave (keeps running) · c new window · n/p next/prev · w list · [ scroll (q stops) · ? all keys }'
